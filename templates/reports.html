{% extends "base.html" %}
{% block title %}{% t "Reports" %}{% endblock %}
{% block content %}
<div class="page-head"><h1>{% t "Reports" %}</h1></div>
<div class="stats vivid">
  {% for key, label in reports %}<a class="stat" href="{% url 'report_view' key %}"><div class="top">{% icon "chart" 20 %}</div><div class="l" style="margin-top:6px;font-weight:500">{{ label }}</div></a>{% endfor %}
</div>
{% endblock %}
