<div class="field{% if field.errors %} has-error{% endif %}{% if wide %} wide{% endif %}">
  {% if field.widget_type == "checkbox" %}<label class="switch" for="{{ field.id_for_label }}">{{ field }}<span>{{ field.label }}</span></label>
  {% else %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req" aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}{% endif %}
  {% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<div class="error">{{ error }}</div>{% endfor %}
</div>
