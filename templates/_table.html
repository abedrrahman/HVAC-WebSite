<div class="table-wrap">
<table>
  <thead><tr>{% for c in table.columns %}<th scope="col">{{ c }}</th>{% endfor %}</tr></thead>
  <tbody>
    {% for row in table.rows %}<tr>{% for cell in row %}<td>{{ cell }}</td>{% endfor %}</tr>
    {% empty %}<tr><td colspan="{{ table.columns|length }}"><div class="empty">{{ table.empty }}</div></td></tr>{% endfor %}
  </tbody>
</table>
</div>
